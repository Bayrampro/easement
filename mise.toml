# One toolchain for developers, git hooks and CI: `mise install`, then `mise run check`.
[tools]
rust = { version = "1.97.0", components = "rustfmt,clippy,rust-analyzer" }
"aqua:axodotdev/cargo-dist" = "0.33.1"
node = "24"
flutter = "3.47.9" # Includes Dart 3.13.7; keep the SDK pair together.
go = "1.27.3"
# The SCIP indexers easement runs (rust-analyzer is the Rust one) and what they build with;
# the tests need them. scip-php and scip-dotnet are installed by composer and dotnet.
"go:github.com/scip-code/scip-go/cmd/scip-go" = "0.2.9"
# Keep the version in step with package.json, which CI installs it from.
"npm:@sourcegraph/scip-typescript" = "0.5.2"
"npm:@sourcegraph/scip-python" = "0.6.8"
java = "temurin-21"
maven = "3.9.16"
dotnet = "9.0.319"
"github:sourcegraph/scip-java" = "0.13.2"
"github:sourcegraph/scip-ruby" = "scip-ruby-v0.5.1"
pnpm = "12.15.0"
hk = "2.8.1"
pkl = "0.32.2"
cargo-deny = "0.20.2"
"github:bnjbvr/cargo-machete" = "0.9.2"
# Reviews the snapshots of the tests (`cargo insta review`).
cargo-insta = "1.49.0"
jactionlint = "2.3.0"
# Used by jactionlint to check the run: scripts of workflows.
shellcheck = "0.11.0"
betterleaks = "1.9.0"
typos = "1.51.1"
rumdl = "0.3.0"
lychee = "0.24.2"
# Installs the agent skills of `mise run skills`.
"npm:skills" = "1.7.4"

# Where `composer global require` (macOS, Linux) and `dotnet tool install --global` put
# scip-php and scip-dotnet, which the tests need; the CI workflow shows how to install them.
[env]
_.path = [
  "{{config_root}}/target/dart-indexer",
  "{{env.HOME}}/.composer/vendor/bin",
  "{{env.HOME}}/.config/composer/vendor/bin",
  "{{env.HOME}}/.dotnet/tools",
]

[tasks.setup]
description = "Install dependencies, the git hooks and the agent skills"
depends = ["skills"]
run = ["pnpm install --frozen-lockfile", "hk install"]

# The skills of the mattpocock-skills plugin (its .claude-plugin/plugin.json), without the
# in-progress and misc ones. They are copied into .agents/skills and linked for Claude Code;
# both are gitignored, rerun the task to update them.
[tasks.skills]
description = "Install Matt Pocock's agent skills into the project"
run = """
skills add mattpocock/skills --agent claude-code codex --yes --skill \
  ask-matt diagnosing-bugs grill-with-docs triage improve-codebase-architecture \
  setup-matt-pocock-skills tdd to-spec to-tickets wayfinder implement implement-spec \
  prototype research domain-modeling codebase-design code-review pr retro wizard \
  grill-me grilling handoff teach to-questionnaire wait-what writing-for-agents
"""

[tasks.check]
description = "Run every check, the same set CI runs"
run = "hk check --all"

[tasks.install-dart-indexer]
description = "Install the pinned Dart indexer launcher"
run = ["cd tools/dart-indexer && dart pub get --enforce-lockfile", "dart tools/dart-indexer/bin/install.dart"]

[tasks.prepare-dart-fixtures]
description = "Seed Flutter dependencies before offline Dart integration tests"
run = "cd tests/fixtures/flutter-basic && flutter pub get --enforce-lockfile"

[tasks.fix]
description = "Apply the automatic fixes"
run = "hk fix --all"

[tasks.install-dart-semantics]
description = "Install the opt-in pinned Dart semantic companion"
run = ["cd tools/dart-indexer && dart pub get --enforce-lockfile", "dart tools/dart-indexer/bin/install_semantics.dart"]

[tasks.check-dart-semantics]
description = "Format, analyze and test the Dart semantic companion"
run = ["dart format --output=none --set-exit-if-changed tools/dart-indexer/bin tools/dart-indexer/test", "dart analyze --fatal-infos tools/dart-indexer", "dart tools/dart-indexer/test/semantics_test.dart"]
