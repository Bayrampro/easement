name: CI

on:
  pull_request:
  push:
    branches: [main]
  # macOS runners are scarce and slow to start, so macOS is tested once a night
  # (and on demand) instead of on every push.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every lint, the same set as `mise run check` locally.
  check:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the tools pinned in mise.toml, the same ones used locally.
      - name: Setup mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The self-architecture check also indexes the Dart installer source.
      - name: Install the pinned Dart indexer for the self-check
        working-directory: tools/scip-dart
        run: |
          dart pub get --enforce-lockfile
          dart bin/install.dart

      - name: Put the Dart indexer on PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/target/dart-indexer" >> "$GITHUB_PATH"

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-

      - name: Run every check
        run: mise run check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Conventional Commits on the pushed range: release-please reads them.
  commits:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node pnpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch pushes from the zero SHA: nothing to compare against.
          if [ "$FROM" = "0000000000000000000000000000000000000000" ]; then exit 0; fi
          pnpm exec commitlint --from "$FROM" --to "$TO" --verbose

  test:
    strategy:
      fail-fast: false
      matrix:
        # The nightly and manual runs add macOS to what every push runs.
        os: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'push') && '["ubuntu-latest","ubuntu-24.04-arm"]' || '["ubuntu-latest","ubuntu-24.04-arm","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: rust go node pnpm java maven dotnet go:github.com/scip-code/scip-go/cmd/scip-go github:sourcegraph/scip-java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the Flutter SDK bundle
        if: runner.arch != 'ARM64' || runner.os != 'Linux'
        shell: bash
        run: |
          mise install flutter
          echo "$(mise where flutter)/bin" >> "$GITHUB_PATH"

      # Flutter publishes no Linux arm64 SDK bundle. Its pinned framework can
      # bootstrap the native arm64 Dart SDK and platform-neutral analysis inputs.
      - name: Bootstrap Flutter on Linux arm64
        if: runner.arch == 'ARM64' && runner.os == 'Linux'
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = c197ca5199e9ee5661e865596c9c07294dfab51c
          "$RUNNER_TEMP/flutter/bin/flutter" --suppress-analytics --version
          "$RUNNER_TEMP/flutter/bin/flutter" --suppress-analytics precache --universal
          mise link flutter@3.47.9 "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      # From package.json and the lockfile: the npm backend of mise leaves
      # scip-typescript unable to find its modules on Windows.
      - name: Install the TypeScript and Python indexers
        run: pnpm install --frozen-lockfile

      - name: Put the indexers on the PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      # scip-php needs PHP 8.3 or newer and Composer; not every runner image has them.
      - name: Setup PHP
        uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60 # v2.40.0
        with:
          php-version: "8.4"
          tools: composer

      # The released scip-php (v0.0.2) cannot be installed: every protobuf it accepts has a
      # security advisory. This is a commit of its main branch, taken from git because its
      # zip has symlinks that Windows cannot extract.
      - name: Install the PHP indexer
        shell: bash
        run: |
          composer global require "davidrjenni/scip-php:dev-main#71a5b117ec4c5dd2af302e363410e604e5df309e" --no-interaction --prefer-source
          composer global config bin-dir --absolute --quiet >> "$GITHUB_PATH"

      # scip-java wraps javac in a bash script that needs bash 4.4; macOS ships 3.2.
      - name: Install a current bash
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      # scip-ruby has no Linux arm64 release yet (sourcegraph/scip-ruby#228); the Ruby test
      # skips itself there.
      - name: Install the Ruby indexer
        if: runner.arch != 'ARM64' || runner.os != 'Linux'
        shell: bash
        run: |
          mise install github:sourcegraph/scip-ruby
          mise where github:sourcegraph/scip-ruby >> "$GITHUB_PATH"

      - name: Install the C# indexer
        shell: bash
        run: |
          dotnet tool install --global scip-dotnet --version 0.2.16
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Install the pinned Dart indexer
        working-directory: tools/scip-dart
        run: |
          dart pub get --enforce-lockfile
          dart bin/install.dart

      - name: Put the Dart indexer on PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/target/dart-indexer" >> "$GITHUB_PATH"

      - name: Verify the Dart dependency tools
        shell: bash
        run: |
          command -v flutter
          command -v dart
          command -v scip_dart
          flutter --suppress-analytics --version
          dart --version
          scip_dart --version

      - name: Prepare the real Flutter fixture
        working-directory: tests/fixtures/dart/flutter-basic
        run: flutter pub get --enforce-lockfile

      - run: cargo test --locked
